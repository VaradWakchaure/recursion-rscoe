<!DOCTYPE html>
<html>
<head>

<title>Recursion by RSCOE</title>

<style>

body{
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  text-align:center;
}

header{
  background:#222;
  color:white;
  padding:20px;
}

#login-box{
  background:white;
  width:350px;
  margin:50px auto;
  padding:25px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

input{
  width:90%;
  padding:10px;
  margin:10px 0;
}

button{
  padding:10px 20px;
  background:#1976d2;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#125ea8;
}

a{
  color:#1976d2;
}

</style>

</head>

<body>

<header>
<h1>Recursion by RSCOE</h1>
<p>Online Quiz Platform</p>
</header>

<div id="login-box">

<h2>Login</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<br>

<button onclick="login()">Login</button>

<p>
Don't have an account?
<a href="register.html">Register</a>
</p>

</div>

<script>

async function login(){

  const email = document.getElementById("email").value
  const password = document.getElementById("password").value

  try{

    const res = await fetch("/api/auth/login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        email,
        password
      })
    })

    const data = await res.json()

    if(!res.ok){
      alert(data.msg)
      return
    }

    // store token
    localStorage.setItem("token", data.token)

    // go to dashboard
    window.location.href = "dashboard.html"

  }
  catch(err){
    alert("Login failed")
  }

}

</script>

</body>
</html>
