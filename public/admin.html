<!DOCTYPE html>
<html>
<head>

<title>Recursion by RSCOE - Admin</title>

<style>

body{
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  text-align:center;
}

header{
  background:#222;
  color:white;
  padding:20px;
}

#admin-box{
  background:white;
  width:450px;
  margin:40px auto;
  padding:30px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

input, select{
  width:90%;
  padding:10px;
  margin:8px 0;
}

button{
  padding:10px 20px;
  margin-top:15px;
  border:none;
  border-radius:6px;
  background:#1976d2;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#125ea8;
}

.logout{
  background:#d32f2f;
}

.logout:hover{
  background:#a52424;
}

</style>

</head>

<body>

<header>
<h1>Recursion by RSCOE</h1>
<p>Admin Panel</p>
</header>

<div id="admin-box">

<h2>Add Question</h2>

<input type="number" id="round" placeholder="Round Number">

<input type="text" id="question" placeholder="Question">

<input type="text" id="optionA" placeholder="Option A">

<input type="text" id="optionB" placeholder="Option B">

<input type="text" id="optionC" placeholder="Option C">

<input type="text" id="optionD" placeholder="Option D">

<select id="correctAnswer">
<option value="">Select Correct Answer</option>
<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="D">D</option>
</select>

<br>

<button onclick="addQuestion()">Add Question</button>

<button class="logout" onclick="logout()">Logout</button>

</div>

<script>

const token = localStorage.getItem("token")

// protect admin page
if(!token){
  window.location.href = "login.html"
}

// OPTIONAL: check role in token (prevents non-admin access)
try{
  const payload = JSON.parse(atob(token.split('.')[1]))

  if(payload.role !== "admin"){
    alert("Access denied")
    window.location.href = "dashboard.html"
  }

}catch(err){
  localStorage.removeItem("token")
  window.location.href = "login.html"
}


async function addQuestion(){

  const round = document.getElementById("round").value
  const question = document.getElementById("question").value

  const optionA = document.getElementById("optionA").value
  const optionB = document.getElementById("optionB").value
  const optionC = document.getElementById("optionC").value
  const optionD = document.getElementById("optionD").value

  const correctAnswer = document.getElementById("correctAnswer").value

  const options = [optionA, optionB, optionC, optionD]

  try{

    const res = await fetch("/api/admin/question", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${token}`
      },
      body:JSON.stringify({
        round,
        question,
        options,
        correctAnswer
      })
    })

    const data = await res.json()

    if(!res.ok){
      alert(data.msg || data.message || "Error adding question")
      return
    }

    alert("Question added successfully")

    // clear form after success
    document.getElementById("question").value=""
    document.getElementById("optionA").value=""
    document.getElementById("optionB").value=""
    document.getElementById("optionC").value=""
    document.getElementById("optionD").value=""
    document.getElementById("correctAnswer").value=""

  }
  catch(err){
    console.error(err)
    alert("Failed to add question")
  }

}


function logout(){

  localStorage.removeItem("token")

  window.location.href = "login.html"

}

</script>

</body>
</html>
